name: Deploy to ECS Fargate

on:
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}

jobs:
  build:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image_uri.outputs.image_uri }}
      ecr_registry: ${{ steps.login_ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform (to get ECR repo URL before push)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init (to read ECR URL)
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Apply ECR repository only
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.app \
            -var="image_uri=placeholder" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}"

      - name: Get ECR repository URL
        id: ecr_url
        working-directory: terraform
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          echo "ecr_url=${ECR_URL}" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.ecr_url.outputs.ecr_url }}:${{ github.sha }}" \
            --tag "${{ steps.ecr_url.outputs.ecr_url }}:latest" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.ecr_url.outputs.ecr_url }}:${{ github.sha }}"
          docker push "${{ steps.ecr_url.outputs.ecr_url }}:latest"

      - name: Set image URI output
        id: image_uri
        run: |
          echo "image_uri=${{ steps.ecr_url.outputs.ecr_url }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Infrastructure with Terraform
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="image_uri=${{ needs.build.outputs.image_uri }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get ALB DNS name
        id: alb_dns
        working-directory: terraform
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to stabilise
        run: |
          echo "Waiting for ECS service to reach steady state..."
          aws ecs wait services-stable \
            --cluster "${{ secrets.PROJECT_NAME }}-cluster" \
            --services "${{ secrets.PROJECT_NAME }}-service" \
            --region "${{ secrets.AWS_REGION }}"
          echo "ECS service is stable."

      - name: Self-verify - health check against ALB
        run: |-
          ALB_DNS="${{ steps.alb_dns.outputs.alb_dns }}"
          HEALTH_URL="http://${ALB_DNS}/health"
          echo "Checking health endpoint: ${HEALTH_URL}"

          MAX_RETRIES=10
          RETRY_DELAY=15
          attempt=1

          while [ $attempt -le $MAX_RETRIES ]; do
            echo "Attempt ${attempt}/${MAX_RETRIES}: GET ${HEALTH_URL}"
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 "${HEALTH_URL}" || echo "000")

            echo "HTTP status: ${HTTP_STATUS}"

            if echo "${HTTP_STATUS}" | grep -qE '^2[0-9]{2}$'; then
              echo "SUCCESS: App returned ${HTTP_STATUS} - deployment verified."
              exit 0
            fi

            echo "Non-2xx response (${HTTP_STATUS}). Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            attempt=$((attempt + 1))
          done

          echo "FAILURE: Health check did not return 2xx after ${MAX_RETRIES} attempts."
          echo "Final URL checked: ${HEALTH_URL}"
          exit 1
