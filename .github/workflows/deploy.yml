name: Build and Deploy to ECS Fargate

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
      ecr_registry: ${{ steps.login_ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag from git SHA
        id: set_tag
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get AWS account ID
        id: account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ secrets.PROJECT_NAME }}" \
            || aws ecr create-repository --repository-name "${{ secrets.PROJECT_NAME }}"

      - name: Log in to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          ECR_REGISTRY="${{ steps.login_ecr.outputs.registry }}"
          IMAGE_TAG="${{ steps.set_tag.outputs.image_tag }}"
          PROJECT="${{ secrets.PROJECT_NAME }}"
          docker build \
            -t "${ECR_REGISTRY}/${PROJECT}:${IMAGE_TAG}" \
            -t "${ECR_REGISTRY}/${PROJECT}:latest" \
            .

      - name: Push Docker image to ECR
        run: |
          ECR_REGISTRY="${{ steps.login_ecr.outputs.registry }}"
          IMAGE_TAG="${{ steps.set_tag.outputs.image_tag }}"
          PROJECT="${{ secrets.PROJECT_NAME }}"
          docker push "${ECR_REGISTRY}/${PROJECT}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${PROJECT}:latest"

  deploy:
    name: Terraform Deploy to ECS Fargate
    runs-on: ubuntu-latest
    needs: build
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Import ECR repository into Terraform state (if exists)
        working-directory: terraform
        run: |
          terraform import \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="image_tag=${IMAGE_TAG}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            aws_ecr_repository.app "${{ secrets.PROJECT_NAME }}" || true

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="image_tag=${IMAGE_TAG}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Retrieve ALB DNS name
        id: alb_dns
        working-directory: terraform
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.PROJECT_NAME }}-cluster" \
            --services "${{ secrets.PROJECT_NAME }}-service"

      - name: Self-verify - health check against ALB
        run: |-
          ALB_DNS="${{ steps.alb_dns.outputs.alb_dns }}"
          echo "Checking health at http://${ALB_DNS}/health"
          for i in $(seq 1 12); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://${ALB_DNS}/health" || echo "000")
            echo "Attempt ${i}: HTTP ${HTTP_CODE}"
            if [[ "${HTTP_CODE}" =~ ^[23] ]]; then
              echo "Health check passed with HTTP ${HTTP_CODE}"
              exit 0
            fi
            echo "Not ready yet, waiting 15s..."
            sleep 15
          done
          echo "ERROR: Health check failed after all retries. Last HTTP code: ${HTTP_CODE}"
          exit 1
