name: Build and Deploy

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # BUILD: build Docker image, push to ECR
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image_uri.outputs.image_uri }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Pre-create the ECR repository if it does not yet exist so that
      # `docker push` succeeds before Terraform has run for the first time.
      # Terraform will import (adopt) this repo on the first apply.
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ secrets.PROJECT_NAME }}" \
            --region "${{ secrets.AWS_REGION }}" 2>/dev/null \
          || aws ecr create-repository \
               --repository-name "${{ secrets.PROJECT_NAME }}" \
               --region "${{ secrets.AWS_REGION }}"

      - name: Set image URI output
        id: image_uri
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="${REGISTRY}/${{ secrets.PROJECT_NAME }}:${{ github.sha }}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image_uri.outputs.image_uri }}" \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image_uri.outputs.image_uri }}"

  # ---------------------------------------------------------------------------
  # DEPLOY: Terraform init -> import ECR repo -> apply -> wait -> smoke test
  # ---------------------------------------------------------------------------
  deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      # Import the ECR repository that the build job may have pre-created so
      # Terraform adopts it instead of trying (and failing) to create it again.
      - name: Import ECR repository (adopt if already exists)
        working-directory: terraform
        run: |
          terraform import \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="container_image=${{ needs.build.outputs.image_uri }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            aws_ecr_repository.app "${{ secrets.PROJECT_NAME }}" || true

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="container_image=${{ needs.build.outputs.image_uri }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}"

      - name: Capture Terraform outputs
        id: tf_outputs
        working-directory: terraform
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          ECS_CLUSTER=$(terraform output -raw ecs_cluster_name)
          ECS_SERVICE=$(terraform output -raw ecs_service_name)
          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=${ECS_CLUSTER}" >> "$GITHUB_OUTPUT"
          echo "ecs_service=${ECS_SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to reach steady state
        run: |
          echo "Waiting for ECS service '${{ steps.tf_outputs.outputs.ecs_service }}' in cluster '${{ steps.tf_outputs.outputs.ecs_cluster }}' to reach steady state..."
          aws ecs wait services-stable \
            --cluster "${{ steps.tf_outputs.outputs.ecs_cluster }}" \
            --services "${{ steps.tf_outputs.outputs.ecs_service }}" \
            --region "${{ secrets.AWS_REGION }}"
          echo "ECS service is stable."

      - name: Smoke test - hit /health endpoint
        run: |-
          ALB_URL="http://${{ steps.tf_outputs.outputs.alb_dns }}/health"
          echo "Smoke testing: ${ALB_URL}"

          # Retry for up to 3 minutes (18 attempts x 10 s) to allow the ALB
          # health checks to pass and traffic to flow.
          MAX_ATTEMPTS=18
          SLEEP_SECS=10
          attempt=1

          while [ $attempt -le $MAX_ATTEMPTS ]; do
            echo "Attempt ${attempt}/${MAX_ATTEMPTS} - GET ${ALB_URL}"
            HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              --max-time 10 "${ALB_URL}" || echo "000")

            if echo "$HTTP_STATUS" | grep -qE '^(2|3)[0-9]{2}$'; then
              echo "SUCCESS - received HTTP ${HTTP_STATUS}"
              exit 0
            fi

            echo "Received HTTP ${HTTP_STATUS}, retrying in ${SLEEP_SECS}s..."
            sleep $SLEEP_SECS
            attempt=$((attempt + 1))
          done

          echo "FAILED - /health did not return a 2xx/3xx after ${MAX_ATTEMPTS} attempts."
          exit 1
