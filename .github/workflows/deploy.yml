name: Deploy to ECS Fargate

on:
  workflow_dispatch:

jobs:
  ##############################################################################
  # BUILD - build Docker image, push to ECR
  ##############################################################################
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build-push.outputs.image_uri }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        id: ensure-ecr
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ secrets.PROJECT_NAME }}" \
            --region "${{ secrets.AWS_REGION }}" \
          || aws ecr create-repository \
               --repository-name "${{ secrets.PROJECT_NAME }}" \
               --region "${{ secrets.AWS_REGION }}"

      - name: Build, tag, and push Docker image
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.PROJECT_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Create a minimal requirements.txt if one does not exist
          if [ ! -f requirements.txt ]; then
            echo "fastapi>=0.110.0" > requirements.txt
            echo "uvicorn[standard]>=0.29.0" >> requirements.txt
            echo "gunicorn>=21.2.0" >> requirements.txt
            echo "aiofiles>=23.2.1" >> requirements.txt
          fi

          # Ensure public/ directory exists so COPY public/ in Dockerfile doesn't fail
          mkdir -p public

          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "Built and pushed: ${IMAGE_URI}"

  ##############################################################################
  # DEPLOY - Terraform apply, update ECS service
  ##############################################################################
  deploy:
    name: Deploy Infrastructure & Service
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Import ECR repository into Terraform state (adopt if already exists)
        working-directory: terraform
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          # If the ECR repo was pre-created by the build job, import it so
          # Terraform adopts rather than tries to recreate it.
          terraform import \
            -var="image_uri=${{ needs.build.outputs.image_uri }}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="aws_region=${AWS_REGION}" \
            aws_ecr_repository.app "${PROJECT_NAME}" || true

      - name: Terraform Plan
        working-directory: terraform
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          terraform plan \
            -var="image_uri=${{ needs.build.outputs.image_uri }}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="aws_region=${AWS_REGION}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Get ALB DNS name
        id: get-alb
        working-directory: terraform
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"
          echo "ALB DNS: ${ALB_DNS}"

      - name: Wait for ECS service to stabilise
        env:
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          CLUSTER="${PROJECT_NAME}-cluster"
          SERVICE="${PROJECT_NAME}-service"
          echo "Waiting for ECS service ${SERVICE} in cluster ${CLUSTER} to reach steady state..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${SERVICE}" \
            --region "${AWS_REGION}"
          echo "ECS service is stable."

      - name: Self-verify - health check
        env:
          ALB_DNS: ${{ steps.get-alb.outputs.alb_dns }}
        run: |-
          echo "Hitting health endpoint: http://${ALB_DNS}/health"

          # Retry for up to 3 minutes to allow tasks to pass health checks
          MAX_RETRIES=18
          SLEEP_SECS=10
          SUCCESS=0

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 15 \
              "http://${ALB_DNS}/health" || echo "000")

            echo "Attempt ${i}/${MAX_RETRIES}: HTTP ${HTTP_CODE}"

            if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
              echo "Health check passed with HTTP ${HTTP_CODE}."
              SUCCESS=1
              break
            fi

            if [ "${i}" -lt "${MAX_RETRIES}" ]; then
              echo "Non-2xx response (${HTTP_CODE}), retrying in ${SLEEP_SECS}s..."
              sleep "${SLEEP_SECS}"
            fi
          done

          if [ "${SUCCESS}" -ne 1 ]; then
            echo "ERROR: Health check failed after ${MAX_RETRIES} attempts. Last HTTP code: ${HTTP_CODE}"
            exit 1
          fi

          echo "Deployment verified successfully."
          echo "App URL: http://${ALB_DNS}"
