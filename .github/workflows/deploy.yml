name: Deploy to ECS Fargate

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image_meta.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Derive ECR repository URI and image tag
        id: image_meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION }}"
          REPO="${{ secrets.PROJECT_NAME }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          IMAGE_URI="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:sha-${SHORT_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ secrets.PROJECT_NAME }}" \
            --region "${{ secrets.AWS_REGION }}" \
          || aws ecr create-repository \
            --repository-name "${{ secrets.PROJECT_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.IMAGE_URI }}" \
            --file Dockerfile \
            .

      - name: Push Docker image to ECR
        run: |
          docker push "${{ env.IMAGE_URI }}"

  deploy:
    name: Terraform Apply - Deploy to ECS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Import ECR repository into Terraform state (idempotent)
        working-directory: terraform
        run: |
          terraform import \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="image_uri=${{ needs.build.outputs.image_uri }}" \
            aws_ecr_repository.app "${{ secrets.PROJECT_NAME }}" \
          || true

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="image_uri=${{ needs.build.outputs.image_uri }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve tfplan

      - name: Retrieve ALB DNS name
        id: alb_dns
        working-directory: terraform
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=${ALB_DNS}" >> "$GITHUB_OUTPUT"

      - name: Wait for ECS service to stabilise
        run: |
          CLUSTER_NAME=$(cd terraform && terraform output -raw ecs_cluster_name)
          SERVICE_NAME=$(cd terraform && terraform output -raw ecs_service_name)
          echo "Waiting for ECS service ${SERVICE_NAME} in cluster ${CLUSTER_NAME} to become stable..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER_NAME}" \
            --services "${SERVICE_NAME}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Smoke test - verify /health endpoint returns 2xx
        run: |-
          ALB_DNS="${{ steps.alb_dns.outputs.alb_dns }}"
          HEALTH_URL="http://${ALB_DNS}/health"
          echo "Hitting ${HEALTH_URL} ..."
          # Retry for up to 3 minutes to allow ALB + ECS tasks to be fully ready
          MAX_ATTEMPTS=18
          SLEEP_SECONDS=10
          attempt=1
          while [ $attempt -le $MAX_ATTEMPTS ]; do
            HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 "${HEALTH_URL}" || echo "000")
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: HTTP ${HTTP_CODE}"
            if echo "${HTTP_CODE}" | grep -qE '^2[0-9]{2}$'; then
              echo "Health check passed with HTTP ${HTTP_CODE}"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep "${SLEEP_SECONDS}"
          done
          echo "ERROR: Health check failed after ${MAX_ATTEMPTS} attempts. Last HTTP code: ${HTTP_CODE}"
          exit 1
